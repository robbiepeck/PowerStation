version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Keep compiler and Node types aligned with the versions supported by
      # typescript-eslint and Electron. Major upgrades are reviewed together.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '09:30'
      timezone: Australia/Brisbane
    open-pull-requests-limit: 3
    labels:
      - dependencies
